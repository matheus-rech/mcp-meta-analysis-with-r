# separate terms of service, privacy policy, and support
# documentation.
#
# See https://github.com/r-lib/actions/tree/master/examples#readme for
# additional example workflows available for the R community.

name: R

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      # The MCP server shells out to these scripts rather than shipping an R package, so there is no DESCRIPTION for rcmdcheck to read and parsing is the check that applies.
      - name: Check R scripts parse
        run: |
          for script in $(git ls-files '*.R'); do
            echo "Parsing $script"
            Rscript -e "invisible(parse('$script'))"
          done
